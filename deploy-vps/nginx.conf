# =============================================================================
# AntiPiracy Defense Lab — Nginx (proxy reverso + HTTPS)
# =============================================================================
# Substitua SEU_DOMINIO pelo domínio/IP da VPS.
# O painel roda na porta 5050 e o core (opcional, público) na 8484.
#
# Para HTTPS gratuito com Let's Encrypt, rode:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d SEU_DOMINIO
# =============================================================================

server {
    listen 80;
    server_name SEU_DOMINIO;

    # Painel (interface do cliente)
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Core público (opcional) — para o cliente "ver" o servidor do provedor.
# Se não quiser expor o core, remova este bloco inteiro.
server {
    listen 80;
    server_name core.SEU_DOMINIO;

    location / {
        proxy_pass http://127.0.0.1:8484;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
