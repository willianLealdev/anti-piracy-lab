services:
  core:
    build: .
    command: python core_server.py
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PUBLIC_URL: "http://173.249.14.170:8080"
    ports:
      - "8080:8080"
    volumes:
      - core_data:/app/data
      - core_streams:/app/streams
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  painel:
    build: .
    command: python app.py
    environment:
      HOST: "0.0.0.0"
      PORT: "5050"
    extra_hosts:
      - "173.249.14.170:host-gateway"
      - "host.docker.internal:host-gateway"
    ports:
      - "5050:5050"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5050/api/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  core_data:
  core_streams:
