services:
  core:
    build: .
    command: sh -c "python gerar_streams.py || true; exec python core_server.py"
    environment:
      HOST: "0.0.0.0"
      PORT: "8484"
      PUBLIC_URL: "http://173.249.14.170:8484"
    volumes:
      - core_data:/app/data
      - core_streams:/app/streams
    restart: unless-stopped

  painel:
    build: .
    command: sh -c "python gerar_streams.py || true; exec python app.py"
    environment:
      HOST: "0.0.0.0"
      PORT: "5050"
      CORE_URL: "http://core:8484"
      PUBLIC_URL: "http://173.249.14.170:5050"
    volumes:
      - panel_data:/app/data
    depends_on:
      - core
    restart: unless-stopped

volumes:
  core_data:
  core_streams:
  panel_data:
