services:
  core:
    build: .
    command: python core_server.py
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PUBLIC_URL: "http://bandplay.defense-lab.net"
      PROVIDER_FILTER: "bandplay"
    volumes:
      - core_data:/app/data
      - core_streams:/app/streams
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  core_data:
  core_streams:
